name: Gerar APK Android - GKD Controle Diário

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Dependências do Projeto
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev

      - name: Compilar Aplicação Web (Vite)
        run: npm run build

      - name: Inicializar Plataforma Android (Capacitor)
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Dar Permissão de Execução ao Gradle Wrapper
        run: |
          cd android
          chmod +x gradlew

      - name: Compilar APK Android (Debug/Instalável)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renomear APK para Nome Oficial
        run: |
          mkdir -p apk_output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk_output/GKD_Controle_Diario.apk

      - name: Disponibilizar APK para Download (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: GKD_Controle_Diario_APK
          path: apk_output/GKD_Controle_Diario.apk
          if-no-files-found: error
