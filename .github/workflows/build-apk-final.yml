name: Gerar APK Android - Controle Diário

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar Licenças e Instalar Build Tools Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Instalar Dependências e Capacitor 6
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0 sharp --save-dev

      - name: Compilar Aplicação Web (Vite)
        run: npm run build

      - name: Gerar Projeto Android com Nome Controle Diário
        run: |
          npx cap init "Controle Diário" "com.gkd.controlediario" --web-dir dist || true
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Injetar Ícone com Tamanho Equilibrado (Meio Termo ~76%)
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          async function run() {
            let iconPath = ["public/icon2.png", "icon2.png", "Icon2.png", "public/Icon2.png"].find(p => fs.existsSync(p));
            if (!iconPath) {
              const files = fs.readdirSync("public");
              const found = files.find(f => f.toLowerCase().includes("icon2"));
              if (found) iconPath = path.join("public", found);
            }

            if (!iconPath) {
              console.error("Nenhum ícone encontrado!");
              return;
            }

            console.log("Utilizando ícone oficial:", iconPath);
            const resDir = path.resolve("android/app/src/main/res");
            const sharp = require("sharp");

            const sizes = [
              { dir: "mipmap-mdpi", size: 48, fg: 108 },
              { dir: "mipmap-hdpi", size: 72, fg: 162 },
              { dir: "mipmap-xhdpi", size: 96, fg: 216 },
              { dir: "mipmap-xxhdpi", size: 144, fg: 324 },
              { dir: "mipmap-xxxhdpi", size: 192, fg: 432 }
            ];

            for (const s of sizes) {
              const target = path.join(resDir, s.dir);
              if (!fs.existsSync(target)) fs.mkdirSync(target, { recursive: true });

              // Meio termo: 76% da área
              const logoSizeFg = Math.round(s.fg * 0.76);
              const logoBufferFg = await sharp(iconPath)
                .resize(logoSizeFg, logoSizeFg, { fit: "contain", background: { r: 0, g: 0, b: 0, alpha: 0 } })
                .png()
                .toBuffer();

              await sharp({
                create: {
                  width: s.fg,
                  height: s.fg,
                  channels: 4,
                  background: { r: 0, g: 0, b: 0, alpha: 0 }
                }
              })
              .composite([{ input: logoBufferFg, gravity: "center" }])
              .png()
              .toFile(path.join(target, "ic_launcher_foreground.png"));

              // Ícone legado quadrado
              const legacySize = Math.round(s.size * 0.90);
              const logoLegacy = await sharp(iconPath)
                .resize(legacySize, legacySize, { fit: "contain", background: { r: 255, g: 255, b: 255, alpha: 1 } })
                .png()
                .toBuffer();

              await sharp({
                create: {
                  width: s.size,
                  height: s.size,
                  channels: 4,
                  background: { r: 255, g: 255, b: 255, alpha: 1 }
                }
              })
              .composite([{ input: logoLegacy, gravity: "center" }])
              .png()
              .toFile(path.join(target, "ic_launcher.png"));

              // Ícone redondo
              await sharp({
                create: {
                  width: s.size,
                  height: s.size,
                  channels: 4,
                  background: { r: 255, g: 255, b: 255, alpha: 1 }
                }
              })
              .composite([{ input: logoLegacy, gravity: "center" }])
              .png()
              .toFile(path.join(target, "ic_launcher_round.png"));
            }

            const drawables = fs.readdirSync(resDir).filter(f => f.startsWith("drawable"));
            for (const d of drawables) {
              const dPath = path.join(resDir, d);
              try {
                fs.copyFileSync(iconPath, path.join(dPath, "splash.png"));
              } catch(e){}
            }

            console.log("✅ Ícones formatados no meio termo perfeito (76%)!");
          }
          run().catch(console.error);
          '

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Separar Arquivo APK
        run: |
          mkdir -p apk_output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk_output/Controle_Diario.apk

      - name: Publicar APK para Download (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Controle_Diario_APK
          path: apk_output/Controle_Diario.apk
          if-no-files-found: error
