name: Gerar APK Android - GKD Controle Diário

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Dependências
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev

      - name: Compilar Aplicação Web
        run: npm run build

      - name: Inicializar Projeto Android (Capacitor)
        run: |
          npx cap init "GKD Controle Diário" "com.gkd.controlediario" --web-dir dist || true
          npx cap add android || true
          npx cap sync android

      - name: Ajustar Permissões Gradle
        run: |
          cd android
          chmod +x gradlew

      - name: Compilar APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Organizar Arquivo APK
        run: |
          mkdir -p apk_output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk_output/GKD_Controle_Diario.apk

      - name: Publicar APK para Download (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: GKD_Controle_Diario_APK
          path: apk_output/GKD_Controle_Diario.apk
